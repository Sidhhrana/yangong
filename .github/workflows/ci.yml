name: ci
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: domain and connector tests
        run: node --experimental-strip-types --test src/domain/*.test.ts src/connectors/*.test.ts

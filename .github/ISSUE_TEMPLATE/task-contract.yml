name: Task Contract
description: 提一个可验收的贡献合同。维护者用这个；参与者按合同提 PR。
title: "[Task] "
labels: ["contract"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: 我要什么。一句话。
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: 交什么。文件、接口、用例、文档。
      placeholder: "- src/domain/...\n- docs/..."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: 不能动什么。
      placeholder: "- 不要改支付\n- 不要把 Attempt 状态写回 Task"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: 怎么证明做到了。必须可判定。
    validations:
      required: true
  - type: input
    id: suites
    attributes:
      label: Test suites to touch
      description: Verification Library 的 key。怎么证明。没有套件就不要用这份合同模板，先写草稿讨论。
      placeholder: "voice/realtime-interruption-v1"
    validations:
      required: true
  - type: dropdown
    id: sandbox
    attributes:
      label: Verification Environment
      description: SandboxSpec key。三个人必须在同一环境下测。
      options:
        - voice-runtime-v3.2
        - review-rubric-v1
        - field-airgap-v1
    validations:
      required: true
  - type: input
    id: reward
    attributes:
      label: Reward
      description: 人民币奖池。Winner ≠ Paid。贴 0x 钱包不占席，也不是收款账号。只支付宝。
      placeholder: "¥0 OSS contract · or ¥3000 CNY contest · 仅支付宝"
    validations:
      required: true
  - type: dropdown
    id: slots
    attributes:
      label: Slots
      options:
        - exclusive (1)
        - contest (3)
        - cooperative
      default: 0
    validations:
      required: true
